<div class="app-layout">
  
  <aside class="sidebar">
    <div class="brand-header">
      <div class="logo-box">LC</div>
      <a routerLink="/" class="brand-name">LogicCore</a>
    </div>

    <div class="sidebar-scroll">
      <div class="nav-section">
        <span class="nav-label">Platform</span>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
          <span class="icon">📊</span> Dashboard
        </a>
        <a routerLink="/chat" routerLinkActive="active" class="nav-item">
          <span class="icon">🤖</span> AI Mentor
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-label">Learning Resources</span>
        <a href="javascript:void(0)" class="nav-item disabled">
          <span class="icon">📚</span> Course Modules
        </a>
        <a href="javascript:void(0)" class="nav-item disabled">
          <span class="icon">💻</span> Code Sandbox
        </a>
        <a href="javascript:void(0)" class="nav-item disabled">
          <span class="icon">📝</span> Assessments
        </a>
        <a href="javascript:void(0)" class="nav-item disabled">
          <span class="icon">🏆</span> Leaderboards
        </a>
      </div>
    </div>

    <div class="sidebar-footer">
      <ng-container *ngIf="auth.user as user; else signedOut">
        <div class="signed-in-user">Signed in as {{ user.display_name }}</div>
        <button type="button" class="btn-auth btn-login" (click)="signOut()">Sign Out</button>
      </ng-container>
      <ng-template #signedOut>
        <a routerLink="/login" class="btn-auth btn-login">Sign In</a>
        <a routerLink="/register" class="btn-auth btn-register">Create Account</a>
      </ng-template>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
